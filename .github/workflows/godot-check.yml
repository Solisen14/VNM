name: Godot 4 parse and smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  godot-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['4.4.1', '4.7.2']
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${{ matrix.version }}-stable/Godot_v${{ matrix.version }}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v${{ matrix.version }}-stable_linux.x86_64
          echo "/tmp" >> "$GITHUB_PATH"
      - name: Import and parse Godot project
        run: Godot_v${{ matrix.version }}-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Launch main scene
        run: Godot_v${{ matrix.version }}-stable_linux.x86_64 --headless --path . --quit-after 60
      - name: Tutorial regression smoke
        run: Godot_v${{ matrix.version }}-stable_linux.x86_64 --headless --path . --script res://tests/pass1_smoke.gd
      - name: Autonomous mining and resource economy regression
        run: Godot_v${{ matrix.version }}-stable_linux.x86_64 --headless --path . --script res://tests/pass2_smoke.gd
      - name: Draw the active asteroid workface and gameplay HUD
        run: Godot_v${{ matrix.version }}-stable_linux.x86_64 --headless --path . --script res://tests/pass2_map_smoke.gd
      - name: Verify second Insight, salvage drones and intact material accounting
        run: Godot_v${{ matrix.version }}-stable_linux.x86_64 --headless --path . --script res://tests/pass3_smoke.gd
