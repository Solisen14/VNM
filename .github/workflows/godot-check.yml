name: Godot 4 parse and smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          echo "/tmp" >> "$GITHUB_PATH"
      - name: Parse the Godot project
        run: Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Run VNM tutorial smoke
        run: Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/pass1_smoke.gd
